<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Animated Logo Loader</title><style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:transparent}
body{display:grid;place-items:center;overflow:hidden;font-family:Inter,Arial,sans-serif}
.loader{position:relative;width:min(72vw,360px);aspect-ratio:1;display:grid;place-items:center}
.loader:before{content:"";position:absolute;inset:-10%;border-radius:50%;
  background:radial-gradient(circle,rgba(15,150,180,.16),transparent 68%);
  filter:blur(6px);opacity:0;animation:ambientIn 1.2s ease 2.4s forwards}
.logo{width:100%;height:100%;overflow:visible}
.rig{animation:settle .6s ease-out 2.60s 1 both, float 3.6s ease-in-out 2.80s infinite}

/* guide lines: quick blueprint flashes before construction */
.guide{fill:none;stroke:url(#lineGrad);stroke-width:2;stroke-linecap:round;opacity:0;
  stroke-dasharray:140;stroke-dashoffset:140;
  filter:drop-shadow(0 0 3px rgba(10,213,230,.65));
  animation:guideDraw .5s ease-out forwards, guideFade .35s ease-in .42s forwards}
.guide.g2{animation-delay:.06s,.48s}
.guide.g3{animation-delay:.12s,.54s}
.guide.g4{animation-delay:.03s,.45s}

.facet{opacity:0;transform-box:fill-box;transform-origin:center;
  filter:blur(3px);
  transform:scale(.4) translateY(3px);
  animation:facetIn .6s cubic-bezier(.16,.8,.24,1) var(--delay) forwards}
.facet.accent{filter:blur(3px) drop-shadow(0 0 0 rgba(10,213,230,0))}
.facet.accent{animation:facetInAccent .65s cubic-bezier(.2,.85,.28,1.18) var(--delay) forwards}

/* idle: blueprint line flashes along the logo's own internal gaps, looping after construction */
.idle-guide{fill:none;stroke:url(#lineGrad);stroke-width:2;stroke-linecap:round;opacity:0;
  stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
  filter:drop-shadow(0 0 3px rgba(10,213,230,.6));
  animation:idleGuide var(--dur) ease-in-out var(--idelay) infinite}

.loader:after{content:"";position:absolute;width:52%;height:11%;left:24%;bottom:2%;
  background:radial-gradient(ellipse,rgba(0,174,204,.24),transparent 68%);
  filter:blur(10px);opacity:0;animation:shadowIn .6s ease 2.60s forwards, shadowPulse 3.6s ease-in-out 2.80s infinite}

@keyframes ambientIn{to{opacity:1}}
@keyframes guideDraw{to{stroke-dashoffset:0;opacity:.75}}
@keyframes guideFade{to{opacity:0}}
@keyframes idleGuide{
  0%{stroke-dashoffset:var(--len);opacity:0}
  6%{opacity:.7}
  16%{stroke-dashoffset:0;opacity:.6}
  27%{opacity:0}
  100%{opacity:0}
}

@keyframes facetIn{
  0%{opacity:0;filter:blur(3px);transform:scale(.4) translateY(3px)}
  60%{opacity:1;filter:blur(0);transform:scale(1.03) translateY(0)}
  100%{opacity:1;filter:blur(0);transform:scale(1) translateY(0)}
}
@keyframes facetInAccent{
  0%{opacity:0;filter:blur(3px) drop-shadow(0 0 0 rgba(10,213,230,0));transform:scale(.2)}
  55%{opacity:1;filter:blur(0) drop-shadow(0 0 7px rgba(10,213,230,.95));transform:scale(1.3)}
  78%{transform:scale(.94)}
  100%{opacity:1;filter:blur(0) drop-shadow(0 0 2px rgba(10,213,230,.4));transform:scale(1)}
}
@keyframes settle{
  0%{transform:scale(1.015)}
  100%{transform:scale(1)}
}
@keyframes float{
  0%,12%,100%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
}
@keyframes shadowIn{to{opacity:1}}
@keyframes shadowPulse{
  0%,12%,100%{opacity:.5;transform:scaleX(.82)}
  50%{opacity:.85;transform:scaleX(1)}
}

@media(prefers-reduced-motion:reduce){
  .facet,.guide,.rig,.loader:after,.loader:before,.idle-guide{animation:none!important}
  .facet{opacity:1!important;filter:none!important;transform:none!important}
  .guide,.idle-guide{opacity:0!important}
  .loader:after,.loader:before{opacity:1!important}
}
